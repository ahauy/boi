services:
  - type: web
    name: boi-qvgy
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install && pnpm --filter @palmsight/shared build && pnpm --filter backend build
    startCommand: pnpm --filter backend db:sync-indexes && pnpm --filter backend start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: IDENTITY_HASH_SECRET
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_FALLBACK_PROVIDER
        value: groq
      - key: AI_FALLBACK_MODEL
        value: qwen/qwen3.8-27b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_API_KEY
        sync: false
      - key: AI_TIMEOUT_MS
        value: 40000
      - key: AI_MAX_TOKENS
        value: 2000
      - key: AI_TEMPERATURE
        value: 0.7
      - key: STARTER_GRANT
        value: 5
      - key: PRICE_PER_ACTION
        value: 5
      - key: REFERRAL_DAILY_CAP
        value: 5
      - key: REFERRAL_NETWORK_DAILY_CAP
        value: 5
      - key: CLIENT_IP_HEADER
        value: x-forwarded-for
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: palmsight/readings
      - key: CLOUDINARY_AVATAR_FOLDER
        value: palmsight/avatars
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.palmsight.mobile2
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RTDN_PUSH_TOKEN
        sync: false
      - key: SUB_WEEKLY_ID
        value: weeklyid
      - key: SUB_MONTHLY_ID
        value: monthlyid
      - key: SUB_YEARLY_ID
        value: yearlyid
      - key: ENFORCE_VIP_SCHOOLS
        value: true
      - key: REWARDED_ADS_ENABLED
        value: true
      - key: MIN_AD_WATCH_SECONDS
        value: 15
