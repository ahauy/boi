# PalmSight Local Development Infrastructure
# MongoDB 7 Replica Set (không còn gửi email nên không cần Mailpit)
# See docs/getting-started.md

services:
  # MongoDB 7 with single-node replica set (rs0) auto-initiation
  # Replica set is required for multi-document ACID transactions used by CreditLedgerService.
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data:/data/db
    entrypoint:
      - bash
      - -c
      - |
        trap 'kill -TERM $$PID; wait $$PID' TERM INT
        docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all &
        PID=$$!
        (
          until mongosh --port 27017 --quiet --eval "rs.status().ok" >/dev/null 2>&1; do
            mongosh --port 27017 --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})" >/dev/null 2>&1 && break
            sleep 1
          done
        ) &
        wait $$PID
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval "
          try {
            const status = rs.status();
            if (status.ok === 1) quit(0);
          } catch (err) {
            const res = rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'localhost:27017' }]
            });
            if (res.ok === 1 || res.codeName === 'AlreadyInitialized') quit(0);
            quit(1);
          }
        "
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

volumes:
  mongodb_data:
